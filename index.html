<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Copenhagen — an interactive journey through fission, memory, and an occupied city."><title>Copenhagen</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='black' d='M0 0h32v32H0z'/%3E%3Ccircle cx='16' cy='16' r='2' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css?v=scale-4">
</head>
<body>
<canvas id="world" aria-label="Click to split the particle"></canvas>
<canvas id="city-world" hidden aria-label="第一幕：Copenhagen"></canvas>
<div id="walk-controls" hidden><button id="walk-left" aria-label="Walk left">←</button><button id="walk-right" aria-label="Walk right">→</button></div>
<button id="bell-prompt" hidden><kbd>E</kbd><span id="bell-action">Ring the bell</span></button>
<div id="act2-status" class="sr-only" aria-live="polite"></div>
<div id="whiteout" aria-hidden="true"></div><div id="top-edge" aria-hidden="true"></div>
<header id="toolbar" aria-label="Game menu" inert><span id="brand">Copenhagen</span><nav><button id="restart" data-i18n="restart">Restart</button><button id="pause" aria-pressed="false">Pause</button><button id="chapter-open" aria-haspopup="dialog" aria-controls="chapters">Chapter</button><button id="fullscreen" aria-pressed="false">Fullscreen</button><span class="divider" aria-hidden="true"></span><button id="settings-open" data-i18n="settings" aria-haspopup="dialog">Settings</button><button id="clue-open" data-i18n="clue" aria-haspopup="dialog">Clue</button></nav></header>
<section id="date" aria-hidden="true"><div id="year" aria-label="1945"></div><div id="month-window"><div id="month-track"><span></span><span></span></div></div><div id="place"></div></section>
<dialog id="settings"><div class="dialog-heading"><h1 data-i18n="settings">Settings</h1><button class="close" data-close aria-label="Close">×</button></div><div class="setting"><label for="language" data-i18n="language">Language</label><select id="language"><option value="en">English</option><option value="zh">中文</option></select></div><div class="setting volume-row"><label for="volume" data-i18n="sound">Sound</label><input type="range" id="volume" min="0" max="100" value="65" aria-label="Volume"><button id="mute" aria-pressed="false">Mute</button></div><details><summary data-i18n="controls">Controls</summary><dl><div><dt><kbd data-i18n="click">Click</kbd> / <kbd>Space</kbd></dt><dd data-i18n="split">Split</dd></div><div><dt><kbd>← →</kbd> / <kbd>A D</kbd></dt><dd data-i18n="walk">Walk</dd></div><div><dt><kbd>E</kbd></dt><dd data-i18n="interact">Interact</dd></div><div><dt><kbd>P</kbd></dt><dd data-i18n="pauseResume">Pause / resume</dd></div><div><dt><kbd>R</kbd></dt><dd data-i18n="restart">Restart</dd></div><div><dt><kbd>M</kbd></dt><dd data-i18n="muteSound">Mute / unmute</dd></div><div><dt><kbd>Esc</kbd></dt><dd data-i18n="menu">Menu / close</dd></div></dl></details></dialog>
<dialog id="clue"><div class="dialog-heading"><h1 data-i18n="clue">Clue</h1><button class="close" data-close aria-label="Close">×</button></div><p id="clue-text"></p></dialog>
<dialog id="chapters" aria-labelledby="chapters-title"><div class="dialog-heading"><h1 id="chapters-title">Chapter</h1><button class="close" data-close aria-label="Close">×</button></div><div class="chapter-list"><button id="chapter-prologue">prologue</button><button id="chapter-act1">Act I</button></div></dialog>
<div id="menu-status" class="sr-only" role="status" aria-live="polite"></div>
<link id="asset-rumble" rel="preload" href="assets/rumble.wav" as="fetch" crossorigin>
<link id="asset-bomb" rel="preload" href="assets/bomb.mp3" as="fetch" crossorigin>
<link id="asset-train" rel="preload" href="assets/train.mp3" as="fetch" crossorigin>
<audio id="bgm2" src="assets/hand-covers-bruise-reprise.mp3" preload="auto" loop></audio>
<audio id="bgm" src="assets/travel-to-edinburgh.mp3" preload="auto" loop></audio>
<script src="act2-audio.js?v=scale-4"></script>
<script src="act2.js?v=scale-4"></script>
<script src="scene-art.js?v=scale-4"></script>
<script src="game.js?v=scale-4"></script>
</body></html>
